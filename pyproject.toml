[project]
name = "liminal-orm"
version = "4.6.3"
description = "An ORM and toolkit that builds on top of Benchling's platform to keep your schemas and downstream code dependencies in sync."
authors = [{ name = "DynoTx Open Source", email = "opensource@dynotx.com" }]
requires-python = ">=3.10,<3.15"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "benchling-sdk>=1.21.2,<2",
    "bs4>=0.0.2,<0.0.3",
    "numpy>=1.23.5,<2",
    "pandas>=1.5.3,<3; python_version < '3.12'",
    "pandas>=2.1.1,<3; python_version >= '3.12'",
    "pydantic>=2,<=2.13",
    "requests>=2.32.5,<3",
    "rich>=14.2,<15",
    "sqlalchemy>=1.4.49,<2",
    "tenacity>=8,<10",
    "typer>=0.20,<1",
    "lxml>=5.3.0,<7",
    "psycopg2-binary>=2.9.11,<3",
    "tornado==6.5.0",
    "click>=8.2.2,<9",
    "playwright>=1.61.0,<2",
]

[virtualenvs]
in-project = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[project.urls]
Homepage = "https://github.com/dynotx/liminal-orm"
Repository = "https://github.com/dynotx/liminal-orm"
Documentation = "https://dynotx.github.io/liminal-orm/"
"Bug Tracker" = "https://github.com/dynotx/liminal-orm/issues"

[project.scripts]
liminal = "liminal.cli.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=6.31,<7",
    "mkdocs-material>=9.6.19,<10",
    "mypy>=1.18.1,<2",
    "pre-commit>=4.0.1,<5",
    "pytest>=8.4.2,<9",
    "ruff>=0.11.13,<1",
    "sqlalchemy==1.4.49",
    "types-beautifulsoup4>=4.12.0.20240907,<5",
    "types-requests>=2.32.0.20240914,<3",
]

[tool.hatch.build.targets.sdist]
include = ["liminal"]

[tool.hatch.build.targets.wheel]
include = ["liminal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/"
namespace_packages = true
no_implicit_optional = true
python_version = "3.10"
strict_optional = true
packages = "liminal"
plugins = ["pydantic.mypy", "numpy.typing.mypy_plugin"]
show_error_codes = true
warn_unused_ignores = true
disable_error_code=["union-attr"]

[tool.ruff]
target-version = "py310"

[[tool.mypy.overrides]]
module = ["sqlalchemy.*"]
ignore_missing_imports = true
