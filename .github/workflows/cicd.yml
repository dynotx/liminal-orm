name: cicd

on:
  workflow_dispatch:
  pull_request:
defaults:
  run:
    shell: bash

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10.8", "3.10.9"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-mypy-

      - name: pre-commit
        run: |
          uv run pre-commit run -a

  test:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10.8", "3.10.9"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest liminal/
